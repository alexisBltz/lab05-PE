name: Publicar UniBudget Social
on:
  push:
    branches: [main]
    paths: ['proyecto/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proyecto/package-lock.json
      - run: npm ci
        working-directory: proyecto
      - run: npm run typecheck && npm run lint && npm run build:pages
        working-directory: proyecto
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: proyecto/dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
